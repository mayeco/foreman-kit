# ==============================================================================
# .foreman-kit/agents.yaml - Which agent CLIs this application uses, who does what and
# the limits of one call
# ==============================================================================
# Written by `foreman-kit init` and `foreman-kit update --agents`, then owned by
# this application. Read on every agent call and by the preflight. Every key is
# written here: one that is missing or invalid keeps the agents from running
# (`foreman-kit config check` names it).
#
# The agent CLIs the kit knows, and where the skills of each go:
#   claude        Claude Code             .claude/skills/
#   codex         OpenAI Codex            .agents/skills/
#   copilot       GitHub Copilot          .github/skills/
#   hermes        Hermes                  .hermes/skills/
#   opencode      OpenCode                .opencode/skills/
#   agy           Google Antigravity      .agents/skills/
#   kilo          Kilo Code               .kilocode/skills/
#   cline         Cline                   .cline/skills/
#   pi            pi                      .pi/skills/
#   omp           oh-my-pi, a fork of pi  .omp/skills/
#   crush         Charm's Crush           .crush/skills/
#   cursor-agent  Cursor Agent            .cursor/skills/
#   zcode         ZCode                   .zcode/skills/
# Change the agents with `foreman-kit update --agents ...`: it installs their skills
# and writes their commands below. Everything else may be edited by hand.

agents: [claude] # agent CLIs installed here; each gets the kit's skills

roles:
  plan: # writes the OpenSpec change of each backlog item
    agents: [claude] # in order of preference; a role without agents does not run
    timeout: 30m # one call of this role
    args: {} # per agent, e.g. {claude: "--model claude-opus-5-5"}
  build: # implements the tasks in the child repositories
    agents: [claude]
    timeout: 2h
    args: {}
  cycle: # runs the cycle's judgment
    agents: [claude]
    # `foreman-kit config check` warns when budget.total of .foreman-kit/cycle.yaml does
    # not fit in it
    timeout: 1h
    args: {}

# How each call picks among the agents of its role:
#   in_order    the first one, then the next when it fails
#   random      any of them first, then the others in the order listed, so the calls
#               spread over the agents' quotas instead of draining the first
#   least_busy  the one with the fewest calls running, so changes built at once
#               spread over them
selection: in_order

# full: each agent runs its `run` command. restricted: each runs its `restricted`
# command; an agent without one cannot be used while this is restricted.
permissions: full

limits:
  # An agent that shows no work for this long is stopped and the attempt counts as
  # failed: no CPU at the rate of work across its processes, no change in its
  # worktree, no output. Work it runs outside its own processes (inside containers)
  # is not seen. From a quarter of it on, `foreman-kit status` and the portal show
  # the agent as idle. never: it is not watched
  idle_timeout: 20m
  # CPU counts as work from this share of one core, in percent, between two looks of
  # the watchdog (a minute apart): a frozen CLI still wakes up for its timers (about
  # 1), a test run or a build uses far more. 0: any CPU use counts
  idle_cpu_percent: 5
  # Extra attempts with the same agent after a failure (timeout, error), before the
  # next agent of its role. None after a usage limit or a stall: those go straight to
  # the next agent. An attempt that left changes is followed by one told what it
  # changed, to continue from there. 0: none
  retries: 1
  retry_after: 2m # wait before each of those attempts; 0s: none
  ping_timeout: 3m # the preflight's ping of each agent

outage: # every agent of a role is out: a usage limit, a lost login
  # No worker starts for one minute; the wait doubles on each further outage, up to
  # this
  max_wait: 15m
  # Outages a change waits through before it is blocked. never: it waits as long as
  # it takes
  give_up_after: 3

# Each command runs exactly as written: the kit adds nothing to it.
#   run         a call while permissions is full
#   restricted  a call while permissions is restricted
#   ping        the preflight's ping (the run command when there is none)
# Placeholders:
#   {{prompt}}       the prompt, as one argument
#   {{prompt_file}}  the path of a file that holds the prompt
#   {{workdir}}      the directory the agent works in
#   {{timeout}}      the role's timeout, in seconds
#   {{args}}         the role's args for this agent; a command without it gets them
#                    after its last word
# Every agent the kit knows has its commands here, as the kit ships them: add one to agents: or to
# a role and it runs as written. Add a custom agent binary with its own entry, then list it in a role.
commands:
  claude:
    run: >-
      claude -p {{prompt}} --output-format json --no-session-persistence --permission-mode
      bypassPermissions --max-budget-usd 5 --disallowedTools "Bash(git commit *) Bash(git push
      *) Bash(git rebase *) Bash(git reset *) Bash(git checkout *) Bash(git switch *) Bash(rm
      -rf *)" {{args}}
    restricted: >-
      claude -p {{prompt}} --output-format json --no-session-persistence --permission-mode
      acceptEdits --max-budget-usd 5 --allowedTools "Read Edit Write Glob Grep Bash(openspec *)
      Bash(git status *) Bash(git diff *) Bash(git log *) Bash(git show *) Bash(git rev-parse *)
      Bash(foreman-kit gates *) Bash(foreman-kit exec *) Bash(foreman-kit status *)
      Bash(foreman-kit progress *) Bash(foreman-kit completed-since *) Bash(foreman-kit
      evaluation-report *) Bash(foreman-kit prompt-report *) Bash(foreman-kit memory *)
      Bash(agent-memory *) Bash(foreman-kit visual-qa *) Bash(jev noul *) Bash(jev choice *)
      Bash(jev score *) Bash(jev eval *) Bash(jev validate *)" --disallowedTools "Bash(git
      commit *) Bash(git push *) Bash(git rebase *) Bash(git reset *) Bash(git checkout *)
      Bash(git switch *) Bash(rm -rf *)" {{args}}
    ping: claude -p {{prompt}} --no-session-persistence --max-budget-usd 0.50 {{args}}
  agy:
    run: agy -p {{prompt}} --print-timeout {{timeout}}s --dangerously-skip-permissions {{args}}
    restricted: >-
      agy -p {{prompt}} --print-timeout {{timeout}}s --dangerously-skip-permissions --sandbox
      {{args}}
    ping: agy -p {{prompt}} --print-timeout 170s {{args}}
  cline:
    run: cline --yolo --cwd {{workdir}} {{args}} {{prompt}}
    ping: cline --yolo {{args}} {{prompt}}
  codex:
    run: codex exec --dangerously-bypass-approvals-and-sandbox {{args}} {{prompt}}
    restricted: codex exec --full-auto {{args}} {{prompt}}
    ping: codex exec {{args}} {{prompt}}
  copilot:
    run: >-
      copilot -p {{prompt}} --silent --allow-all-tools --deny-tool "shell(git commit)"
      --deny-tool "shell(git push)" --deny-tool "shell(git rebase)" --deny-tool "shell(git
      reset)" --deny-tool "shell(git checkout)" --deny-tool "shell(git switch)" {{args}}
    ping: copilot -p {{prompt}} --silent {{args}}
  crush:
    run: crush run --quiet {{args}} {{prompt}}
    ping: crush run --quiet {{args}} {{prompt}}
    stdin_null: true
  cursor-agent:
    run: cursor-agent -p --force --trust {{args}} {{prompt}}
    restricted: cursor-agent -p --trust --sandbox enabled {{args}} {{prompt}}
    ping: cursor-agent -p --trust {{args}} {{prompt}}
  hermes:
    run: hermes -z {{prompt}} --yolo --accept-hooks {{args}}
    ping: hermes -z {{prompt}} {{args}}
  kilo:
    run: kilo run --agent code --auto {{args}} {{prompt}}
    restricted: kilo run --agent code {{args}} {{prompt}}
    ping: kilo run --agent code {{args}} {{prompt}}
  omp:
    run: omp -p --no-session --approval-mode=yolo {{args}} {{prompt}}
    restricted: omp -p --no-session {{args}} {{prompt}}
    ping: omp -p --no-session {{args}} {{prompt}}
  opencode:
    run: opencode run --format json {{args}} {{prompt}}
    ping: opencode run {{args}} {{prompt}}
  pi:
    run: pi -p --no-session --approve {{args}} -- {{prompt}}
    restricted: pi -p --no-session --no-approve {{args}} -- {{prompt}}
    ping: pi -p --no-session {{args}} -- {{prompt}}
  zcode:
    run: zcode -p {{prompt}} --mode yolo {{args}}
    restricted: zcode -p {{prompt}} --mode guarded {{args}}
    ping: zcode -p {{prompt}} {{args}}
