[tools]
go = "1.27.4"
# The release: GoReleaser builds it (the workflow uses the same major), gh tags, dispatches and
# watches the workflows of GitHub.
goreleaser = "2.20.0"
gh = "2.103.3"

[env]
# Static binary invariant: never link Cgo (see AGENTS.md §3).
CGO_ENABLED = "0"

[vars]
bin = "bin/foreman-kit"
sim_root = "/tmp/openspec-sim-stack"

# --- Go ----------------------------------------------------------------------

[tasks.fmt]
description = "Format Go sources with gofmt"
run = "gofmt -w cmd internal"

[tasks."fmt:check"]
description = "Fail if any Go source is not gofmt-formatted"
run = '''
#!/usr/bin/env bash
set -euo pipefail
out="$(gofmt -l cmd internal)"
if [ -n "$out" ]; then
  echo "Files need gofmt:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet static analysis"
run = "go vet ./..."

[tasks.build]
description = "Build the static foreman-kit binary into bin/"
run = "go build -o {{vars.bin}} ./cmd/foreman-kit"
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*"]
outputs = ["bin/foreman-kit"]

[tasks.test]
description = "Run unit and integration tests"
usage = 'arg "[pkg]" help="Package pattern to test" default="./internal/..."'
run = "go test -count=1 -timeout 60m {{usage.pkg}}"

[tasks."test:all"]
description = "Run every test in the module, including cmd/"
run = "go test -count=1 -timeout 60m ./..."

[tasks.evaluator-contract]
description = "Run the offline contract check of the evaluator"
depends = ["build"]
run = "./{{vars.bin}} evaluator-contract"

[tasks.sim]
description = "Run the end-to-end simulation stack (all scenarios by default)"
depends = ["build"]
usage = 'arg "[scenario]" help="Scenario name to run" default="all"'
run = "./{{vars.bin}} sim run {{vars.sim_root}} {{usage.scenario}}"

[tasks."sim:faults"]
description = "Run the fault-injection scenarios (LLM and evaluator outages, agent crashes, git, disk, backlog edge cases)"
depends = ["build"]
usage = 'arg "[scenario]" help="Fault scenario name to run" default="faults"'
run = "./{{vars.bin}} sim run {{vars.sim_root}}-faults {{usage.scenario}}"

[tasks.check]
description = "Full pre-finish verification: vet, build, tests, evaluator contract"
depends = ["vet", "test", "evaluator-contract"]

[tasks."check:full"]
description = "check plus the end-to-end simulation (orchestrator/store/cycle/proc/evaluator changes)"
depends = ["check"]
run = "mise run sim"

[tasks.install]
description = "Install the binary, with the version of the git tags, into ~/.local/bin"
run = '''
#!/usr/bin/env bash
set -euo pipefail
out="$(mktemp -d)"
trap 'rm -rf "$out"' EXIT
scripts/build.sh --out "$out"
mkdir -p ~/.local/bin
cp "$out"/*/foreman-kit ~/.local/bin/foreman-kit
~/.local/bin/foreman-kit version
'''

[tasks."install:release"]
description = "Install the binary of a GitHub release into ~/.local/bin with install.sh (checksum checked)"
usage = 'arg "[tag]" help="Release tag (v4.0.0)" default="latest"'
run = 'sh install.sh --version "${usage_tag?}"'

[tasks."build:all"]
description = "Build the static binary for macOS and Linux, amd64 and arm64, into dist/bin/"
run = "scripts/build.sh --all"

[tasks."npm:pack"]
description = "Pack the npm package (private) of this platform into dist/"
run = "scripts/npm-pack.sh"

[tasks."npm:pack:all"]
description = "Pack the npm package (private) with the binaries of macOS and Linux, amd64 and arm64"
run = "scripts/npm-pack.sh --all"

[tasks."npm:test"]
description = "Run the offline tests of the npm launcher (bundled binary, cache, checked download)"
run = "node --test 'npm/test/*.test.js'"

[tasks."npm:install"]
description = "Build, pack and install foreman-kit globally with npm (NPM=<path> chooses the npm)"
run = "scripts/npm-install.sh"

# --- Version and release tags (scripts/version.sh, scripts/release-tag.sh) ----

[tasks.version]
description = "Print the version detected from the git tags (4.1.1-dev.3+<commit> past v4.1.0)"
run = "scripts/version.sh"

[tasks."version:next"]
description = "Print the tag the next release would get (v4.0.0 when there is none yet)"
usage = '''
arg "[part]" help="Part of the latest release to raise" default="patch" {
  choices "patch" "minor" "major"
}
'''
run = 'scripts/version.sh --tag --next "${usage_part?}"'

[tasks."release:tag"]
description = "Create the next release tag v<semver> on HEAD (first one: v4.0.0); --push publishes it"
usage = '''
arg "[part]" help="patch, minor, major, or a version X.Y.Z" default="patch"
flag "--pre <id>" help="A prerelease: <version>-<id>.N (rc, beta)"
flag "--push" help="Push the tag to origin, which runs the release workflow"
flag "--dry-run" help="Print the tag it would create and create nothing"
flag "-y --yes" help="Do not ask before creating it"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=("${usage_part?}")
if [ -n "${usage_pre:-}" ]; then args+=(--pre "$usage_pre"); fi
if [ "${usage_push:-false}" = "true" ]; then args+=(--push); fi
if [ "${usage_dry_run:-false}" = "true" ]; then args+=(--dry-run); fi
if [ "${usage_yes:-false}" = "true" ]; then args+=(--yes); fi
exec scripts/release-tag.sh "${args[@]}"
'''

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks."release:git"]
description = "Fail unless the checkout is committed and HEAD is pushed to its branch on origin"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
  echo "release:git: the checkout has uncommitted changes; commit them before releasing" >&2
  exit 1
fi
git fetch --quiet origin
branch="$(git rev-parse --abbrev-ref HEAD)"
if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch" 2>/dev/null || true)" ]; then
  echo "release:git: HEAD is not origin/$branch; push the branch before tagging it" >&2
  exit 1
fi
echo "release:git: $(git rev-parse --short=12 HEAD) of $branch is committed and pushed"
'''

[tasks."release:preflight"]
description = "What the release workflow verifies, run here first: gofmt, check, simulations, launcher tests, GoReleaser config"
depends = ["fmt:check", "check", "npm:test", "release:check"]
run = ["mise run sim", "mise run sim:faults"]

[tasks.release]
description = "Release: preflight, then create the next tag v<semver> and push it (the workflow builds the GitHub release and publishes npm)"
usage = '''
arg "[part]" help="patch, minor, major, or a version X.Y.Z" default="patch"
flag "--pre <id>" help="A prerelease: <version>-<id>.N (rc, beta), published on npm under next"
flag "--skip-preflight" help="Tag and push without running release:preflight first"
flag "-y --yes" help="Do not ask before creating the tag"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run release:git
if [ "${usage_skip_preflight:-false}" != "true" ]; then
  mise run release:preflight
fi
args=("${usage_part?}" --push)
if [ -n "${usage_pre:-}" ]; then args+=(--pre "$usage_pre"); fi
if [ "${usage_yes:-false}" = "true" ]; then args+=(--yes); fi
scripts/release-tag.sh "${args[@]}"
echo "release: follow it with: mise run release:watch"
'''

[tasks."release:watch"]
description = "Watch the latest run of the release workflow until it ends"
run = '''
#!/usr/bin/env bash
set -euo pipefail
sleep 5
id="$(gh run list --workflow release.yml --limit 1 --json databaseId -q '.[0].databaseId')"
[ -n "$id" ] || { echo "release:watch: no run of release.yml yet" >&2; exit 1; }
gh run watch "$id" --exit-status
'''

[tasks."release:status"]
description = "Show the latest GitHub release and the versions of the npm package"
run = '''
#!/usr/bin/env bash
set -uo pipefail
gh release list --limit 3
echo "npm @mayeco/foreman-kit:"
npm view @mayeco/foreman-kit dist-tags 2>/dev/null || echo "  not published yet"
'''

[tasks."release:rehearse"]
description = "Run the release workflow on GitHub without publishing: verification, GoReleaser snapshot, npm package packed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
gh workflow run release.yml --ref "$(git rev-parse --abbrev-ref HEAD)"
mise run release:watch
'''

[tasks."npm:publish"]
description = "Publish on npm the package of a GitHub release that exists already (default: the latest release)"
usage = '''
arg "[tag]" help="Release tag whose binaries are published (v4.1.0); default: the latest release"
flag "--dry-run" help="Pack and check the package on GitHub, keep it as an artifact, publish nothing"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="${usage_tag:-}"
if [ -z "$tag" ]; then
  tag="$(gh release view --json tagName -q .tagName)"
fi
dry="${usage_dry_run:-false}"
gh workflow run npm-publish.yml --ref "$(git rev-parse --abbrev-ref HEAD)" -f tag="$tag" -f dry-run="$dry"
sleep 5
id="$(gh run list --workflow npm-publish.yml --limit 1 --json databaseId -q '.[0].databaseId')"
gh run watch "$id" --exit-status
'''

[tasks."npm:publish:local"]
description = "Publish on npm, from this machine with your npm login, the package of a GitHub release (default: the latest)"
usage = '''
arg "[tag]" help="Release tag whose binaries are published (v4.2.0); default: the latest release"
flag "--dry-run" help="Download, check and pack the package, publish nothing"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="${usage_tag:-}"
if [ -z "$tag" ]; then
  tag="$(gh release view --json tagName -q .tagName)"
fi
version="${tag#v}"
case "$version" in
  *-*) dist_tag=next ;;
  *) dist_tag=latest ;;
esac
if [ "${usage_dry_run:-false}" != "true" ]; then
  who="$(npm whoami 2>/dev/null)" || { echo "npm:publish:local: not logged in to npm: run npm login first" >&2; exit 1; }
  echo "npm:publish:local: publishing as $who"
  if npm view "@mayeco/foreman-kit@$version" version >/dev/null 2>&1; then
    echo "npm:publish:local: @mayeco/foreman-kit@$version is already on npm; nothing to publish"
    exit 0
  fi
fi
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
gh release download "$tag" --pattern 'foreman-kit-*' --pattern checksums.txt --dir "$work"
if command -v sha256sum >/dev/null 2>&1; then
  (cd "$work" && sha256sum --check --ignore-missing checksums.txt)
else
  (cd "$work" && shasum -a 256 --check --ignore-missing checksums.txt)
fi
tgz="$(FOREMANKIT_KIT_VERSION="$version" scripts/npm-pack.sh --prebuilt "$work" --public)"
tar -tzf "$tgz"
if [ "${usage_dry_run:-false}" = "true" ]; then
  echo "npm:publish:local: packed $tgz ($version, dist-tag $dist_tag); dry run, nothing published"
  exit 0
fi
npm publish "$tgz" --access public --tag "$dist_tag"
echo "npm:publish:local: published @mayeco/foreman-kit@$version under $dist_tag"
'''

[tasks."release:snapshot"]
description = "Build a release locally with GoReleaser into dist/release/; nothing is published"
run = "goreleaser release --snapshot --clean"

[tasks.tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks.clean]
description = "Remove the built binary and simulation scratch directory"
run = "rm -rf {{vars.bin}} {{vars.sim_root}}"

# --- Portal UI (Node, outputs committed under internal/assets/portal_ui/) ----

[tasks."portal:deps"]
description = "Install portal build dependencies"
dir = "web/portal"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."portal:build"]
description = "Rebuild the portal stylesheet, icon sprite and fonts"
dir = "web/portal"
depends = ["portal:deps"]
run = "npm run build"

[tasks."portal:watch"]
description = "Rebuild portal assets on change"
dir = "web/portal"
depends = ["portal:deps"]
run = "npm run watch"
