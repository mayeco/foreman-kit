# Publishes the npm package @mayeco/foreman-kit from the binaries of a GitHub release of
# foreman-kit: release.yml calls it after GoReleaser, and it can be run by hand for a release that
# exists already (Actions > npm-publish > Run workflow, with the tag).
#
# The package is laid out by scripts/npm-pack.sh --prebuilt --public: it carries the binary of every
# platform of the release under vendor/<os>-<arch>/, and its launcher downloads the one of the
# release (checked against checksums.txt, cached in ~/.cache/foreman-kit/<version>) when the package
# carries none for the machine. Its version is the tag's, set here and nowhere else: each release
# publishes the package of that version, and npm/package.json in the repository is never edited.
# A package packed without --public is private, so nothing but this workflow publishes it. A version
# with a prerelease part (4.1.0-rc.1) is published under the dist-tag next, any other under latest;
# a version npm has already is not published again.
#
# Needs the repository secret NPM_TOKEN: an npm automation token of an account that may publish the
# @mayeco scope. From a public repository the package is published with provenance; npm refuses
# provenance from a private one, so there it is published without it. The releases of a private
# repository cannot be downloaded anonymously: the package then works only on the platforms it
# carries (all four the release builds), and the check of the download is skipped.
name: npm-publish

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (v4.1.0); empty with dry-run: the binaries of the snapshot"
        type: string
        required: false
        default: ""
      dry-run:
        description: "Pack the package and keep it as an artifact, publish nothing"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose binaries are published (v4.1.0)"
        type: string
        required: true
      dry-run:
        description: "Pack the package and keep it as an artifact, publish nothing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: ${{ inputs.dry-run && 'pack (dry run)' || 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Binaries of the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern 'foreman-kit-*' --pattern checksums.txt --dir release
          (cd release && sha256sum --check --ignore-missing checksums.txt)
      - name: Binaries of the snapshot
        if: inputs.tag == ''
        uses: actions/download-artifact@v4
        with:
          name: snapshot-binaries
          path: release
      - name: Version
        id: version
        run: |
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="0.0.0-snapshot.${GITHUB_RUN_NUMBER}"
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Pack
        id: pack
        env:
          FOREMANKIT_KIT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/*.sh
          tgz="$(scripts/npm-pack.sh --prebuilt release --public)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          tar -tzf "$tgz"
      - name: Tests of the launcher
        run: node --test 'npm/test/*.test.js'
      - name: Check the launcher runs the binary it carries
        run: |
          dir="$(mktemp -d)"
          npm install --global --prefix "$dir" "${{ steps.pack.outputs.tgz }}"
          "$dir/bin/foreman-kit" version | tee version.txt
          # A snapshot's binaries carry GoReleaser's version, not the package's 0.0.0-snapshot.<n>.
          if [ -n "${{ inputs.tag }}" ]; then grep -F "${{ steps.version.outputs.version }}" version.txt; fi
      # Without the binary of the platform, the launcher downloads the one of the release.
      - name: Check the launcher downloads the binary of the release
        if: inputs.tag != '' && !github.event.repository.private
        run: |
          dir="$(mktemp -d)"
          npm install --global --prefix "$dir" "${{ steps.pack.outputs.tgz }}"
          rm -rf "$dir"/lib/node_modules/@mayeco/foreman-kit/vendor
          XDG_CACHE_HOME="$dir/cache" "$dir/bin/foreman-kit" version | tee version.txt
          grep -F "${{ steps.version.outputs.version }}" version.txt
          test -x "$dir/cache/foreman-kit/${{ steps.version.outputs.version }}/foreman-kit"
      - uses: actions/upload-artifact@v4
        if: inputs.dry-run
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tgz }}
      # Without the NPM_TOKEN secret nothing is published, and the run does not fail: the package is
      # still packed and checked above, and the reason is written to the run's summary.
      - name: NPM_TOKEN present
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::the secret NPM_TOKEN is not set; the package was packed but not published"
            echo "npm publish skipped: the secret NPM_TOKEN is not set. The package was packed and checked, not published." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish
        if: ${{ !inputs.dry-run && steps.token.outputs.present == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "@mayeco/foreman-kit@$version" version >/dev/null 2>&1; then
            echo "@mayeco/foreman-kit@$version is already on npm; nothing to publish"
            exit 0
          fi
          provenance=--provenance
          if [ "${{ github.event.repository.private }}" = true ]; then
            provenance=""
            echo "::notice title=npm publish without provenance::the repository is private"
          fi
          npm publish "${{ steps.pack.outputs.tgz }}" --access public $provenance --tag "${{ steps.version.outputs.dist-tag }}"
